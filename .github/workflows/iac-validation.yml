name: IaC static validation

on:
  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: IaC static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.10"
          tofu_wrapper: false

      - name: OpenTofu format check
        run: tofu fmt -check -recursive

      - name: Terragrunt HCL format check
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: "1.2.2"
          tofu_version: "1.13.10"
          tg_dir: "."
          tg_command: "hcl fmt --check"