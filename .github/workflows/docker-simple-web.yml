name: Docker simple web

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build simple-web
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker version
        run: |
          docker version
          docker compose version

      - name: Validate docker compose
        working-directory: docker/simple-web
        run: docker compose config

      - name: Build image
        working-directory: docker/simple-web
        run: docker compose build --no-cache

      - name: Run container
        working-directory: docker/simple-web
        run: docker compose up -d

      - name: Smoke test
        run: |
          sleep 3
          curl -f http://localhost:8080

      - name: Show image size
        run: |
          docker images simple-web:local

      - name: Cleanup
        if: always()
        working-directory: docker/simple-web
        run: docker compose down --remove-orphans