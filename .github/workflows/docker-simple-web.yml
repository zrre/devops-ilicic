name: Docker simple web

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build simple-web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Docker version
        run: |
          docker version
          docker compose version

      - name: Validate docker compose
        id: compose_config
        working-directory: docker/simple-web
        run: docker compose config

      - name: Build image
        id: build
        working-directory: docker/simple-web
        run: docker compose build --no-cache

      - name: Install Trivy
        shell: bash
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            TRIVY_VERSION="$(curl -s https://api.github.com/repos/aquasecurity/trivy/releases/latest | jq -r '.tag_name' | sed 's/^v//')"
            curl -L -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
            tar -xzf trivy.tar.gz trivy
            sudo mv trivy /usr/local/bin/trivy
            rm -f trivy.tar.gz
          fi
          trivy --version

      - name: Install Grype
        shell: bash
        run: |
          if ! command -v grype >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          fi
          grype version

      - name: Trivy scan - JSON report
        shell: bash
        run: |
          trivy image \
            --scanners vuln \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --exit-code 0 \
            --output trivy-report.json \
            simple-web:local

      - name: Grype scan - JSON report
        shell: bash
        run: |
          set -euo pipefail

          grype simple-web:local \
            -o json > grype-report.json

      - name: Generate security summary
        if: always()
        shell: bash
        run: |
          python3 .github/scripts/container-security-summary.py
          cat security-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy scan - fail on fixable HIGH and CRITICAL
        id: trivy_gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            simple-web:local

      - name: Grype scan - fail on fixable HIGH and CRITICAL
        id: grype_gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          grype simple-web:local \
            --only-fixed \
            --fail-on high

      - name: Run container
        working-directory: docker/simple-web
        run: docker compose up -d

      - name: Security checks
        id: security_checks
        working-directory: docker/simple-web
        shell: bash
        run: |
          set -euo pipefail

          CONTAINER_UID=$(docker compose exec -T simple-web id -u)

          if [ "$CONTAINER_UID" = "0" ]; then
            echo "ERROR: Container is running as root"
            exit 1
          fi

          echo "Non-root check passed. UID: $CONTAINER_UID"

          CONTAINER_ID=$(docker compose ps -q simple-web)

          test -n "$CONTAINER_ID"

          READ_ONLY=$(docker inspect \
            --format '{{.HostConfig.ReadonlyRootfs}}' \
            "$CONTAINER_ID")

          if [ "$READ_ONLY" != "true" ]; then
            echo "ERROR: Container root filesystem is writable"
            exit 1
          fi

          echo "Read-only filesystem check passed"

      - name: Smoke test
        id: smoke_test
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            --max-time 10 \
            http://localhost:8080

      - name: Show image size
        run: |
          docker images simple-web:local

      - name: Docker build summary
        if: always()
        run: |
          {
            echo "## Docker simple-web summary"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Compose config | ${{ steps.compose_config.outcome }} |"
            echo "| Image build | ${{ steps.build.outcome }} |"
            echo "| Trivy security gate | ${{ steps.trivy_gate.outcome }} |"
            echo "| Grype security gate | ${{ steps.grype_gate.outcome }} |"
            echo "| Security checks | ${{ steps.security_checks.outcome }} |"
            echo "| Smoke test | ${{ steps.smoke_test.outcome }} |"
            echo
            echo "### Image size"
            echo '```text'
            docker images simple-web:local
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload container security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simple-web-security-reports
          path: |
            trivy-report.json
            grype-report.json
            security-summary.md
          retention-days: 3
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        working-directory: docker/simple-web
        run: docker compose down --remove-orphans