#cloud-config
package_update: true
package_upgrade: false

packages:
  - curl
  - git
  - jq
  - ca-certificates
  - gnupg
  - lsb-release
  - unzip

runcmd:
  - |
    bash -lc '
    set -euo pipefail

    USERNAME="${admin_username}"
    RUNNER_DIR="/home/$USERNAME/actions-runner"
    REPO_URL="${github_repo_url}"
    RUNNER_TOKEN="${github_runner_token}"
    RUNNER_LABELS="${github_runner_labels}"
    RUNNER_NAME="${vm_name}"

    echo "Installing Docker..."

    install -m 0755 -d /etc/apt/keyrings

    if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
    fi

    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list

    apt-get update
    apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

    usermod -aG docker "$USERNAME"

    echo "Installing Azure CLI..."

    if ! command -v az >/dev/null 2>&1; then
      curl -sL https://aka.ms/InstallAzureCLIDeb | bash
    fi

    echo "Installing GitHub Actions runner..."

    rm -rf "$RUNNER_DIR"
    mkdir -p "$RUNNER_DIR"
    cd "$RUNNER_DIR"

    RUNNER_VERSION="$(curl -s https://api.github.com/repos/actions/runner/releases/latest | jq -r ".tag_name" | sed "s/^v//")"

    curl -L -o actions-runner-linux-x64.tar.gz \
      "https://github.com/actions/runner/releases/download/v$RUNNER_VERSION/actions-runner-linux-x64-$RUNNER_VERSION.tar.gz"

    tar xzf actions-runner-linux-x64.tar.gz
    chown -R "$USERNAME:$USERNAME" "$RUNNER_DIR"

    sudo -u "$USERNAME" ./config.sh \
      --url "$REPO_URL" \
      --token "$RUNNER_TOKEN" \
      --name "$RUNNER_NAME" \
      --labels "$RUNNER_LABELS" \
      --unattended \
      --replace

    ./svc.sh install "$USERNAME"
    ./svc.sh start

    echo "GitHub runner installation finished."
    '
