name: Docker simple web

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build simple-web
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker version
        run: |
          docker version
          docker compose version

      - name: Validate docker compose
        working-directory: docker/simple-web
        run: docker compose config

      - name: Build image
        working-directory: docker/simple-web
        run: docker compose build --no-cache

      - name: Run container
        working-directory: docker/simple-web
        run: docker compose up -d

      - name: Security checks
        working-directory: docker/simple-web
        run: |
          docker compose exec -T simple-web id
          if docker compose exec -T simple-web sh -c "touch /test-file"; then
            echo "Container filesystem is writable, expected read-only"
            exit 1
          else
            echo "Readonly filesystem check passed"
          fi

      - name: Smoke test
        run: |
          sleep 3
          curl -f http://localhost:8080

      - name: Show image size
        run: |
          docker images simple-web:local
      
      - name: Docker build summary
        if: always()
        run: |
          {
            echo "## Docker simple-web summary"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Compose config | Passed |"
            echo "| Image build | Passed |"
            echo "| Smoke test | Passed |"
            echo "| Non-root user | Passed |"
            echo "| Read-only filesystem | Passed |"
            echo
            echo "### Image size"
            echo
            echo '```text'
            docker images simple-web:local
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        working-directory: docker/simple-web
        run: docker compose down --remove-orphans