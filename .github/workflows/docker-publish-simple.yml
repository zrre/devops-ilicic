name: Docker publish simple-web

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: simple-web
  DOCKER_CONTEXT: docker/simple-web
  DOCKERFILE: docker/simple-web/Dockerfile

jobs:
  publish:
    name: Build and push simple-web image
    runs-on: [self-hosted, macOS, ARM64]

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ vars.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ vars.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ vars.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Select ACR and tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            ACR_NAME="acrilicicdevopstest"
            ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"
            TAGS="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${SHORT_SHA}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            ACR_NAME="acrilicicdevopsprod"
            ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"
            VERSION="$(cat docker/simple-web/VERSION | tr -d '[:space:]')"

            TAGS="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${VERSION}"
            TAGS="${TAGS},${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=${ACR_LOGIN_SERVER}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: ACR login
        shell: bash
        run: |
          az acr login --name "${{ steps.meta.outputs.acr_name }}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Publish summary
        run: |
          {
            echo "## Docker publish summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| ACR | \`${{ steps.meta.outputs.acr_login_server }}\` |"
            echo "| Image | \`${IMAGE_NAME}\` |"
            echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |"
            echo "| Platform | \`linux/amd64\` |"
          } >> "$GITHUB_STEP_SUMMARY"
