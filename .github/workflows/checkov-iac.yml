name: Checkov IaC

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov-real-iac:
    name: Checkov real IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # - name: Install Checkov
      #   shell: bash
      #   run: |
      #     python3 -m pip install --upgrade pip
      #     python3 -m pip install --upgrade checkov
      #     checkov --version

      - name: Run Checkov on real IaC
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            bridgecrew/checkov:latest \
            --directory modules \
            --framework terraform \
            --compact \
            --quiet \
            --soft-fail \
            --output cli > checkov-real.txt

          bash .github/scripts/checkov-summary.sh \
            "Checkov real IaC scan" \
            checkov-real.txt \
            checkov-real-summary.md

          cat checkov-real-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Checkov real report
        id: upload_checkov_real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-real-iac-report
          path: |
            checkov-real.txt
            checkov-real-summary.md
          retention-days: 3
          compression-level: 9
          if-no-files-found: error
          overwrite: true

      - name: Add Checkov real artifact link to summary
        if: always() && steps.upload_checkov_real.outcome == 'success'
        shell: bash
        run: |
          {
            echo
            echo "### Checkov real IaC artifact"
            echo
            echo "[Download Checkov real report](${{ steps.upload_checkov_real.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"

  checkov-demo-broken:
    name: Checkov demo broken IaC
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # - name: Install Checkov
      #   shell: bash
      #   run: |
      #     python3 -m pip install --upgrade pip
      #     python3 -m pip install --upgrade checkov
      #     checkov --version

      - name: Run Checkov demo scan
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            bridgecrew/checkov:latest \
            --directory demo/checkov-broken \
            --framework terraform \
            --compact \
            --quiet \
            --soft-fail \
            --output cli > checkov-demo.txt

          bash .github/scripts/checkov-summary.sh \
            "Checkov demo broken IaC scan" \
            checkov-demo.txt \
            checkov-demo-summary.md

          cat checkov-demo-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Checkov demo report
        id: upload_checkov_demo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-demo-broken-report
          path: |
            checkov-demo.txt
            checkov-demo-summary.md
          retention-days: 3
          compression-level: 9
          if-no-files-found: error
          overwrite: true

      - name: Add Checkov demo artifact link to summary
        if: always() && steps.upload_checkov_demo.outcome == 'success'
        shell: bash
        run: |
          {
            echo
            echo "### Checkov demo artifact"
            echo
            echo "[Download Checkov demo report](${{ steps.upload_checkov_demo.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"