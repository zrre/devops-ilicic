name: Docker simple web

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build simple-web
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker version
        run: |
          docker version
          docker compose version

      - name: Validate docker compose
        working-directory: docker/simple-web
        run: docker compose config

      - name: Build image
        working-directory: docker/simple-web
        run: docker compose build --no-cache

      - name: Install Trivy
        shell: bash
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            brew install trivy
          fi

      - name: Install Grype
        shell: bash
        run: |
          if ! command -v grype >/dev/null 2>&1; then
            brew install grype
          fi

      - name: Trivy scan - report all HIGH/CRITICAL
        shell: bash
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 0 \
            simple-web:local | tee trivy-report.txt

      - name: Trivy scan - fail on fixable HIGH/CRITICAL
        shell: bash
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            simple-web:local

      - name: Grype scan - report all HIGH/CRITICAL
        shell: bash
        run: |
          grype simple-web:local \
            --fail-on negligible \
            -o table | tee grype-report.txt || true

      - name: Grype scan - fail on fixable HIGH/CRITICAL
        shell: bash
        run: |
          grype simple-web:local \
            --only-fixed \
            --fail-on high    

      - name: Security scan summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Container security scan summary"
            echo
            echo "| Scanner | Policy | Result |"
            echo "|---|---|---|"
            echo "| Trivy | Fail on fixable HIGH/CRITICAL vulnerabilities | Completed |"
            echo "| Grype | Fail on fixable HIGH/CRITICAL vulnerabilities | Completed |"
            echo
            echo "### Trivy report"
            echo
            echo '```text'
            if [ -f trivy-report.txt ]; then
              cat trivy-report.txt
            else
              echo "No Trivy report file found."
            fi
            echo '```'
            echo
            echo "### Grype report"
            echo
            echo '```text'
            if [ -f grype-report.txt ]; then
              cat grype-report.txt
            else
              echo "No Grype report file found."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run container
        working-directory: docker/simple-web
        run: docker compose up -d

      - name: Security checks
        working-directory: docker/simple-web
        run: |
          docker compose exec -T simple-web id
          if docker compose exec -T simple-web sh -c "touch /test-file"; then
            echo "Container filesystem is writable, expected read-only"
            exit 1
          else
            echo "Readonly filesystem check passed"
          fi

      - name: Smoke test
        run: |
          sleep 3
          curl -f http://localhost:8080

      - name: Show image size
        run: |
          docker images simple-web:local
      

      - name: Security scan summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Container security scan summary"
            echo
            echo "| Scanner | Policy | Result |"
            echo "|---|---|---|"
            echo "| Trivy | HIGH/CRITICAL with available fix fail the PR | Completed |"
            echo "| Grype | HIGH/CRITICAL with available fix fail the PR | Completed |"
            echo
            echo "### Trivy report"
            echo
            echo '```text'
            if [ -f trivy-report.txt ]; then
              cat trivy-report.txt
            else
              echo "No Trivy report file found."
            fi
            echo '```'
            echo
            echo "### Grype report"
            echo
            echo '```text'
            if [ -f grype-report.txt ]; then
              cat grype-report.txt
            else
              echo "No Grype report file found."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Docker build summary
        if: always()
        run: |
          {
            echo "## Docker simple-web summary"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Compose config | Passed |"
            echo "| Image build | Passed |"
            echo "| Smoke test | Passed |"
            echo "| Non-root user | Passed |"
            echo "| Read-only filesystem | Passed |"
            echo
            echo "### Image size"
            echo
            echo '```text'
            docker images simple-web:local
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        working-directory: docker/simple-web
        run: docker compose down --remove-orphans