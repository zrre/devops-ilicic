name: Branch policy

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate-source-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate source branch
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          echo "Base branch: $BASE"
          echo "Head branch: $HEAD"

          if [ "$BASE" = "develop" ]; then
            if [[ "$HEAD" != feature/* ]]; then
              echo "Only feature/* branches can be merged into develop."
              exit 1
            fi
          fi

          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "develop" ]; then
              echo "Only develop can be merged into main."
              exit 1
            fi
          fi