name: Docker simple web

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  docker-build:
    name: Docker build simple-web
    runs-on: [self-hosted, azure, linux, x64, shared]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker version
        run: |
          docker version
          docker compose version

      - name: Validate docker compose
        working-directory: docker/simple-web
        run: docker compose config

      - name: Build image
        working-directory: docker/simple-web
        run: docker compose build --no-cache

      - name: Install Trivy
        shell: bash
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            TRIVY_VERSION="$(curl -s https://api.github.com/repos/aquasecurity/trivy/releases/latest | jq -r '.tag_name' | sed 's/^v//')"
            curl -L -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
            tar -xzf trivy.tar.gz trivy
            sudo mv trivy /usr/local/bin/trivy
            rm -f trivy.tar.gz
          fi
          trivy --version

      - name: Install Grype
        shell: bash
        run: |
          if ! command -v grype >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          fi
          grype version

      - name: Trivy scan - JSON report
        shell: bash
        run: |
          trivy image \
            --scanners vuln \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --exit-code 0 \
            --output trivy-report.json \
            simple-web:local

      - name: Grype scan - JSON report
        shell: bash
        run: |
          grype simple-web:local \
            -o json > grype-report.json || true

      - name: Generate security summary
        if: always()
        shell: bash
        run: |
          python3 .github/scripts/container-security-summary.py
          cat security-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with security summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            if (!fs.existsSync("security-summary.md")) {
              console.log("security-summary.md not found, skipping PR comment.");
              return;
            }

            const body = fs.readFileSync("security-summary.md", "utf8");
            const marker = "# Container security scan summary";

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(comment =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Trivy scan - fail on fixable HIGH and CRITICAL
        shell: bash
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            simple-web:local

      - name: Grype scan - fail on fixable HIGH and CRITICAL
        shell: bash
        run: |
          grype simple-web:local \
            --only-fixed \
            --fail-on high

      - name: Run container
        working-directory: docker/simple-web
        run: docker compose up -d

      - name: Security checks
        working-directory: docker/simple-web
        run: |
          docker compose exec -T simple-web id
          if docker compose exec -T simple-web sh -c "touch /test-file"; then
            echo "Container filesystem is writable, expected read-only"
            exit 1
          else
            echo "Readonly filesystem check passed"
          fi

      - name: Smoke test
        run: |
          sleep 3
          curl -f http://localhost:8080

      - name: Show image size
        run: |
          docker images simple-web:local

      - name: Docker build summary
        if: always()
        run: |
          {
            echo "## Docker simple-web summary"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Compose config | Passed |"
            echo "| Image build | Passed |"
            echo "| Smoke test | Passed |"
            echo "| Non-root user | Passed |"
            echo "| Read-only filesystem | Passed |"
            echo
            echo "### Image size"
            echo
            echo '```text'
            docker images simple-web:local
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        working-directory: docker/simple-web
        run: docker compose down --remove-orphans