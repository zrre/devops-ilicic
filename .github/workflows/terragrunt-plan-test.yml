name: Terragrunt plan test

on:
  pull_request:
    branches:
      - develop
    # paths:
    #   - "live/**"
    #   - "modules/**"
    #   - ".github/workflows/terragrunt-plan-test.yml"

permissions:
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_AZUREAD: "true"

jobs:
  plan-test:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ vars.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ vars.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ vars.AZURE_TENANT_ID }}"
            }

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"
          tofu_wrapper: false

      - name: Install Terragrunt
        shell: bash
        run: |
          TG_VERSION="0.77.22"
          curl -L "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_darwin_arm64" -o "$RUNNER_TEMP/terragrunt"
          chmod +x "$RUNNER_TEMP/terragrunt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Show versions
        shell: bash
        run: |
          tofu version
          terragrunt --version
          az version

      - name: Terragrunt init
        working-directory: live/test
        run: terragrunt run --all -- init -reconfigure

      - name: Terragrunt HCL format check
        working-directory: .
        run: terragrunt hcl fmt --check

      - name: Terragrunt HCL validate
        working-directory: .
        run: terragrunt hcl validate

      - name: OpenTofu format check
        working-directory: .
        run: tofu fmt -check -recursive

      - name: OpenTofu validate test
        working-directory: live/test
        run: terragrunt run --all -- validate
      
      - name: Plan test
        id: plan
        working-directory: live/test
        shell: bash
        run: |
          set +e
          terragrunt run --all plan -no-color > plan.txt 2>&1
          PLAN_EXIT_CODE=$?
          set -e

          cat plan.txt
          echo "exit_code=${PLAN_EXIT_CODE}" >> "$GITHUB_OUTPUT"

      - name: Format plan comment
        if: always()
        shell: bash
        run: |
          .github/scripts/format-terragrunt-plan.sh test live/test/plan.txt plan-comment.md
          cat plan-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("plan-comment.md", "utf8");

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = "## Terragrunt plan: `test`";
            const existing = comments.data.find(comment =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outputs.exit_code != '0'
        run: exit 1