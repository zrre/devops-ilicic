name: Terragrunt plan prod

on:
  pull_request:
    branches:
      - main
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/terragrunt-plan-prod.yml"

permissions:
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_AZUREAD: "true"

jobs:
  plan-prod:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ vars.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ vars.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ vars.AZURE_TENANT_ID }}"
            }

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10.0"
          tofu_wrapper: false

      - name: Install Terragrunt
        shell: bash
        run: |
          TG_VERSION="0.77.22"
          curl -L "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_darwin_arm64" -o "$RUNNER_TEMP/terragrunt"
          chmod +x "$RUNNER_TEMP/terragrunt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Show versions
        shell: bash
        run: |
          tofu version
          terragrunt --version
          az version

      - name: Terragrunt init
        working-directory: live/prod
        run: terragrunt run --all -- init -reconfigure

      - name: Terragrunt plan
        id: plan
        working-directory: live/prod
        shell: bash
        run: |
          set +e
          terragrunt run --all plan -no-color > plan.txt 2>&1
          EXIT_CODE=$?
          cat plan.txt
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('live/prod/plan.txt', 'utf8');
            const maxLen = 60000;

            const body = `## Terragrunt plan: prod

            Exit code: ${{ steps.plan.outputs.exit_code }}

            <details>
            <summary>Show plan</summary>

            \`\`\`
            ${plan.slice(0, maxLen)}
            \`\`\`

            </details>

            ${plan.length > maxLen ? '\nPlan output was truncated.' : ''}
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan failed
        if: steps.plan.outputs.exit_code != '0'
        run: exit 1
