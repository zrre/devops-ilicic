name: Docker publish simple-web

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: simple-web
  BUILD_CONTEXT: docker/simple-web
  DOCKERFILE: docker/simple-web/Dockerfile
  ACR_NAME: acrilicicdevops
  ACR_LOGIN_SERVER: acrilicicdevops.azurecr.io

jobs:
  publish:
    name: Build and publish simple-web
    runs-on: [self-hosted, azure, linux, x64, shared]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker version
        run: |
          docker version
          docker compose version

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Verify private ACR DNS
        shell: bash
        run: |
          nslookup "${ACR_LOGIN_SERVER}"
          nslookup "${ACR_NAME}.privatelink.azurecr.io"

      - name: ACR login
        shell: bash
        run: |
          az acr login --name "${ACR_NAME}"

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            TAGS="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${SHORT_SHA},${ACR_LOGIN_SERVER}/${IMAGE_NAME}:test"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION="$(cat docker/simple-web/VERSION | tr -d '[:space:]')"

            if [ -z "$VERSION" ]; then
              echo "VERSION file is empty"
              exit 1
            fi

            TAGS="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${VERSION},${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

          echo "Image tags:"
          echo "$TAGS" | tr ',' '\n'

      - name: Build image
        shell: bash
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.tags }}"
          PRIMARY_TAG="${TAGS[0]}"

          docker build \
            -f "${DOCKERFILE}" \
            -t "${PRIMARY_TAG}" \
            "${BUILD_CONTEXT}"

          for tag in "${TAGS[@]}"; do
            if [ "$tag" != "$PRIMARY_TAG" ]; then
              docker tag "$PRIMARY_TAG" "$tag"
            fi
          done

      - name: Push image
        shell: bash
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.tags }}"

          for tag in "${TAGS[@]}"; do
            docker push "$tag"
          done

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Docker publish summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | ${GITHUB_REF_NAME} |"
            echo "| ACR | ${ACR_LOGIN_SERVER} |"
            echo "| Image | ${IMAGE_NAME} |"
            echo
            echo "### Tags"
            echo
            echo '```text'
            echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
