fullnameOverride: argocd

global:
  domain: argo.zrre.net
  image:
    tag: v3.5.6

crds:
  install: false
  keep: true

configs:
  cm:
    admin.enabled: true
    url: https://argo.zrre.net

  params:
    server.insecure: true
    applicationsetcontroller.policy: create-update
    applicationsetcontroller.enable.policy.override: "false"

controller:
  replicas: 1

server:
  replicas: 1

  service:
    type: ClusterIP

  ingress:
    enabled: false
  
  httproute:
    enabled: true

    parentRefs:
      - name: nginx-public
        namespace: nginx-demo
        sectionName: argo-https

    hostnames:
      - argo.zrre.net

    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

repoServer:
  replicas: 1

applicationSet:
  enabled: true
  replicas: 1

dex:
  enabled: true

redis:
  enabled: true

  serviceAccount:
    create: true
    name: argocd-redis

notifications:
  enabled: true