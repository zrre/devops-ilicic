fullnameOverride: argocd

global:
  image:
    tag: v3.5.6

crds:
  install: false
  keep: true

configs:
  cm:
    admin.enabled: true

  params:
    server.insecure: true
    applicationsetcontroller.policy: create-update
    applicationsetcontroller.enable.policy.override: "false"

controller:
  replicas: 1

server:
  replicas: 1

  service:
    type: ClusterIP

  ingress:
    enabled: false

repoServer:
  replicas: 1

applicationSet:
  enabled: true
  replicas: 1

dex:
  enabled: true

redis:
  enabled: true

  serviceAccount:
    create: true
    name: argocd-redis

notifications:
  enabled: true